name: Deploy

# develop / main へのマージ(= push)でそれぞれ dev / prod へデプロイする。
# App HostingのGitHub自動連携は使わず、CIがパスしたことを前提にできるよう
# GitHub ActionsからFirebase CLIを叩く方式に統一している。
on:
  push:
    branches:
      - develop
      - main

# 同一環境への同時デプロイを直列化する(実行中のものはキャンセルしない)。
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity連携でのトークン取得に必要

jobs:
  deploy:
    name: deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      FIREBASE_PROJECT: ${{ github.ref_name == 'main' && 'fire-fire-prod' || 'fire-fire-dev' }}
      WIF_PROVIDER: ${{ github.ref_name == 'main' && secrets.GCP_WIF_PROVIDER_PROD || secrets.GCP_WIF_PROVIDER_DEV }}
      SA_EMAIL: ${{ github.ref_name == 'main' && secrets.GCP_SA_EMAIL_PROD || secrets.GCP_SA_EMAIL_DEV }}
      # App HostingのバックエンドID。dev/prod で同じIDを使う前提。
      # リポジトリの Variables に APPHOSTING_BACKEND_ID を登録しておく
      # (docs/ci-cd-setup.md 3章・4章)。
      APPHOSTING_BACKEND_ID: ${{ vars.APPHOSTING_BACKEND_ID }}
    steps:
      # 環境別のSecretが未設定だと、式の `||` により反対側の環境の値へ黙って
      # フォールバックしてしまう。事故を防ぐため先に存在確認する。
      - name: デプロイ先の設定が揃っているか確認する
        run: |
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="$missing GCP_WIF_PROVIDER_*"
          [ -n "$SA_EMAIL" ] || missing="$missing GCP_SA_EMAIL_*"
          [ -n "$APPHOSTING_BACKEND_ID" ] || missing="$missing APPHOSTING_BACKEND_ID(Variables)"
          if [ -n "$missing" ]; then
            echo "::error::リポジトリの設定が不足しています:$missing (docs/ci-cd-setup.md 参照)"
            exit 1
          fi
          echo "デプロイ先: $FIREBASE_PROJECT / App Hostingバックエンド: $APPHOSTING_BACKEND_ID"

      - uses: actions/checkout@v4

      # サービスアカウント鍵は置かず、Workload Identity連携で短命の資格情報を取得する。
      # Firebase CLIは google-github-actions/auth が書き出す
      # GOOGLE_APPLICATION_CREDENTIALS を参照する。
      - name: Google Cloudに認証する
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SA_EMAIL }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      # 15.22.3 未満は、google-auth-library のトランスポートが keep-alive したソケットを
      # 再利用する際に Node.js 22.23.0 / 24.17.0 のリグレッションを踏み、ADCが有効でも
      # "Failed to authenticate, have you run firebase login?" で確率的に失敗する。
      # 15.22.3 で keep-alive を無効化する回避が入っている(firebase-tools#10717)ため、
      # それ以降のバージョンを使う必要がある。ランナーのNodeは 22.23.1 で該当する。
      # https://github.com/firebase/firebase-tools/issues/10716
      # 下げるときは 15.22.3 を下回らせないこと。詳細は docs/ci-cd-setup.md 8章。
      - name: Firebase CLIを導入する
        run: npm i -g firebase-tools@15.26.0

      # firebase.json の predeploy で `npm run build` が走るため、
      # 先に src/backend の依存をインストールしておく必要がある。
      - name: Backendをビルドする
        working-directory: src/backend
        run: |
          npm ci
          npm run build

      # Cloud Functions のコンテナイメージは Artifact Registry に蓄積する。自動削除
      # ポリシーが未設定のリージョンがあると、firebase deploy は関数のデプロイに成功
      # した状態で「could not set up cleanup policy」を throw して終了する(非対話では
      # 保持日数の確認を出せないため。firebase-tools の deploy/functions/prompts.ts)。
      # デプロイステップが落ちるとジョブが止まり、後続の App Hosting ロールアウトごと
      # 飛んでフロントエンドだけ古いまま残る。そのため deploy の「前」に設定しておく。
      #
      # `firebase deploy` 側に --force を付ける案は採らない。--force はソースから消えた
      # 関数の削除確認までスキップするため、誤ってファイルを消したときに本番の関数が
      # 黙って消える(docs/ci-cd-setup.md 5章)。
      #
      # setpolicy は設定済みのリージョンでは「No changes needed.」、gcf-artifacts が
      # まだ無いリージョンでは「does not exist in Artifact Registry」と出て、いずれも
      # exit 0 で終わる。冪等なので毎回無条件に流してよい。
      #
      # リージョンは src/backend に直書きせず、デプロイ済み関数から引く。将来リージョンを
      # 増やしてもこのステップは変更不要になる。ただしリポジトリは最初の functions
      # デプロイで作られるため、一度もデプロイしていないプロジェクト(と新しく足した
      # リージョン)では取得結果に現れず、その回は従来どおり cleanup policy のエラーで
      # 落ちる。関数自体は作成済みになるので、次の実行でこのステップが効いて緑に戻る
      # ——手作業での setpolicy は要らない。
      - name: Artifact Registry のクリーンアップポリシーを設定する
        run: |
          if ! functions_json=$(firebase functions:list --project "$FIREBASE_PROJECT" --json); then
            echo "::warning::関数一覧を取得できなかったため、クリーンアップポリシーの設定をスキップします"
            exit 0
          fi
          regions=$(printf '%s' "$functions_json" | jq -r '.result[]?.region' | sort -u)
          if [ -z "$regions" ]; then
            echo "::warning::デプロイ済みの関数がないため、クリーンアップポリシーの設定をスキップします(初回デプロイ時は正常)"
            exit 0
          fi
          for region in $regions; do
            echo "クリーンアップポリシーを確認: $region"
            firebase functions:artifacts:setpolicy \
              --project "$FIREBASE_PROJECT" \
              --location "$region" \
              --force
          done

      - name: Functions / Firestore / Storage をデプロイする
        run: |
          firebase deploy \
            --only functions,firestore,storage \
            --project "$FIREBASE_PROJECT" \
            --non-interactive

      # Frontend(Next.js)はApp Hostingのロールアウトを作成してデプロイする。
      # ビルドはApp Hosting側で src/frontend/apphosting.yaml に従って実行される。
      - name: App Hostingのロールアウトを作成する
        run: |
          firebase apphosting:rollouts:create "$APPHOSTING_BACKEND_ID" \
            --project "$FIREBASE_PROJECT" \
            --git-branch "${{ github.ref_name }}" \
            --non-interactive
