<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A4 ログイン | FIRE-FIRE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="mb-6 text-center">
      <p class="text-sm font-semibold text-slate-400 mb-1">FIRE-FIRE</p>
      <h1 class="text-xl font-bold">ログイン</h1>
    </div>

    <!-- ログアウト直後の表示(screen-requirements-auth.md A4)。
         ログアウト完了専用の画面を設けず、操作の結果をここで伝える。直後の1回だけで、
         ガードによる差し戻しやセッション期限切れでA4へ来た場合は出さない。
         モックでは ?loggedOut=1 付きで開いたときに表示する。 -->
    <div id="logged-out-notice" class="alert alert-success mb-5 hidden">
      <span>ログアウトしました。</span>
    </div>
    <script>
      if (new URLSearchParams(location.search).get("loggedOut") === "1") {
        document.getElementById("logged-out-notice").classList.remove("hidden");
      }
    </script>

    <form class="flex flex-col gap-5" onsubmit="return false;">
      <div class="field">
        <label class="label" for="email">メールアドレス</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label class="label" for="password">パスワード</label>
        <input class="input" type="password" id="password" />
      </div>

      <div class="flex items-center justify-between">
        <label class="checkbox-row">
          <input type="checkbox" checked />
          <span>ログイン状態を保持する</span>
        </label>
        <a class="link" href="a6-forgot-password.html">パスワードをお忘れの方</a>
      </div>

      <a href="a5-mfa-verify.html" class="btn btn-primary btn-block">ログイン</a>
    </form>

    <!-- ソーシャルログイン導線(screen-requirements-auth.md 2章)。
         主導線に見せないため、区切り線を挟んだアウトラインボタンとして配置する。 -->
    <div class="divider-or my-5">または</div>

    <a href="a8-account-link.html" class="btn btn-outline btn-block">
      <svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.81z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.91l-3.88-3.01c-1.08.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.95H1.28v3.11A11.997 11.997 0 0 0 12 24z"/>
        <path fill="#FBBC05" d="M5.29 14.28a7.2 7.2 0 0 1 0-4.56V6.61H1.28a12 12 0 0 0 0 10.78l4.01-3.11z"/>
        <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.28 6.61l4.01 3.11C6.23 6.88 8.88 4.77 12 4.77z"/>
      </svg>
      Googleで続ける
    </a>
    <p class="field-hint mt-2 text-center">
      モックでは連携が必要なケース(A8)へ遷移します。実際は2FA未登録ならA3、登録済みならA5へ進みます。
    </p>

    <p class="text-center text-sm text-slate-500 mt-6">
      アカウントをお持ちでない方は
      <a class="link" href="a1-signup.html">サインアップ</a>
    </p>
  </div>
</div>

</body>
</html>
