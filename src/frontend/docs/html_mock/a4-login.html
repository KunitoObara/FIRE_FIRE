<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A4 ログイン | FIRE-FIRE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="mb-6 text-center">
      <p class="text-sm font-semibold text-slate-400 mb-1">FIRE-FIRE</p>
      <h1 class="text-xl font-bold">ログイン</h1>
    </div>

    <form class="flex flex-col gap-5" onsubmit="return false;">
      <div class="field">
        <label class="label" for="email">メールアドレス</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label class="label" for="password">パスワード</label>
        <input class="input" type="password" id="password" />
      </div>

      <div class="flex items-center justify-between">
        <label class="checkbox-row">
          <input type="checkbox" checked />
          <span>ログイン状態を保持する</span>
        </label>
        <a class="link" href="a6-forgot-password.html">パスワードをお忘れの方</a>
      </div>

      <a href="a5-mfa-verify.html" class="btn btn-primary btn-block">ログイン</a>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      アカウントをお持ちでない方は
      <a class="link" href="a1-signup.html">サインアップ</a>
    </p>
  </div>
</div>

</body>
</html>
