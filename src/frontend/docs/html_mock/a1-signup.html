<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A1 サインアップ | FIRE-FIRE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- パスワード表示/非表示トグルの目のアイコン(実装と同じ FontAwesome 7.3.1) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css" />
<link rel="stylesheet" href="common.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="mb-6 text-center">
      <p class="text-sm font-semibold text-slate-400 mb-1">FIRE-FIRE</p>
      <h1 class="text-xl font-bold">アカウントを作成</h1>
    </div>

    <form class="flex flex-col gap-5" onsubmit="return false;">
      <div class="field">
        <label class="label" for="email">メールアドレス</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label class="label" for="password">パスワード</label>

        <!-- 入力欄の右端に表示/非表示トグルを重ねる(A1要件) -->
        <div class="relative">
          <input class="input input-error pr-10" type="password" id="password" value="passw0rd" />
          <button class="password-toggle" type="button" aria-label="パスワードを表示" aria-pressed="false" onclick="togglePassword(this, 'password')">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>
        <p class="field-error">記号を1文字以上含めてください</p>

        <!-- パスワードポリシーのリアルタイムバリデーション表示(A1要件) -->
        <div class="policy-list mt-1">
          <div class="policy-item met">
            <svg class="policy-dot" viewBox="0 0 20 20" fill="none"><path d="M5 10.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            8文字以上
          </div>
          <div class="policy-item met">
            <svg class="policy-dot" viewBox="0 0 20 20" fill="none"><path d="M5 10.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            大文字・小文字を含む
          </div>
          <div class="policy-item met">
            <svg class="policy-dot" viewBox="0 0 20 20" fill="none"><path d="M5 10.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            数字を含む
          </div>
          <div class="policy-item">
            <svg class="policy-dot" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.5"/></svg>
            記号を含む
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label" for="password2">パスワード(確認用)</label>
        <div class="relative">
          <input class="input pr-10" type="password" id="password2" />
          <button class="password-toggle" type="button" aria-label="パスワードを表示" aria-pressed="false" onclick="togglePassword(this, 'password2')">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" />
        <span>
          <a class="link" href="#">利用規約</a> と
          <a class="link" href="#">プライバシーポリシー</a> に同意します
        </span>
      </label>

      <!-- 押下で直接作成せず、入力内容の確認ダイアログを開く(A1要件) -->
      <button class="btn btn-primary btn-block" type="button" onclick="document.getElementById('signup-confirm-dialog').classList.remove('hidden')">アカウント作成</button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      すでにアカウントをお持ちの方は
      <a class="link" href="a4-login.html">ログインはこちら</a>
    </p>
  </div>
</div>

<!-- 入力内容の確認ダイアログ。パスワードは伏字で表示する(A1要件) -->
<div id="signup-confirm-dialog" class="hidden fixed inset-0 flex items-center justify-center p-4" style="background-color: rgb(0 0 0 / 0.4);">
  <div class="card p-6 max-w-sm w-full">
    <h3 class="text-base font-bold mb-3">入力内容の確認</h3>
    <dl class="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1 text-sm mb-4">
      <dt class="text-slate-500">メールアドレス:</dt>
      <dd class="break-all">you@example.com</dd>
      <dt class="text-slate-500">パスワード:</dt>
      <dd>********</dd>
    </dl>
    <p class="text-sm text-slate-500 mb-5">以上の内容でアカウント作成します</p>
    <div class="flex gap-3">
      <button class="btn btn-outline flex-1" type="button" onclick="document.getElementById('signup-confirm-dialog').classList.add('hidden')">もどる</button>
      <a href="a2-verify-email.html" class="btn btn-primary flex-1">はい</a>
    </div>
  </div>
</div>

<script>
  // パスワード欄ごとに独立して平文表示を切り替える(A1要件)
  function togglePassword(button, inputId) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector("i");
    const willShow = input.type === "password";

    input.type = willShow ? "text" : "password";
    icon.classList.toggle("fa-eye", !willShow);
    icon.classList.toggle("fa-eye-slash", willShow);
    // 状態は aria-pressed だけで伝える(ラベルも切り替えると二重に読み上げられる)
    button.setAttribute("aria-pressed", String(willShow));
  }
</script>

</body>
</html>
