<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
</head>
<body>

<div class="app-shell">

  <aside class="app-sidebar">
    <div class="h-[3.75rem] flex items-center px-5 border-b" style="border-color: hsl(var(--border));">
      <span class="font-bold text-sm">FIRE-FIRE</span>
    </div>
    <nav class="flex-1 py-4 flex flex-col gap-1">
      <a class="sidebar-link" href="b1-dashboard.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="12" width="4" height="8"/><rect x="10" y="8" width="4" height="12"/><rect x="17" y="4" width="4" height="16"/></svg>
        ダッシュボード
      </a>
      <a class="sidebar-link" href="b2-csv-import.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        CSV取込
      </a>
      <a class="sidebar-link" href="b3-transactions.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
        収支明細一覧
      </a>
      <a class="sidebar-link" href="b4-category-master.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16" /></svg>
        資産分類マスタ
      </a>
      <a class="sidebar-link sidebar-link-active" href="b5-real-estate-list.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V10l9-6 9 6v11" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 21v-7h6v7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        不動産一覧
      </a>
      <a class="sidebar-link" href="b11-debt-input.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18" stroke-linecap="round"/><path d="M8 15h4" stroke-linecap="round"/></svg>
        負債入力
      </a>
      <div class="my-2 border-t" style="border-color: hsl(var(--border));"></div>
      <a class="sidebar-link" href="b8-fire-goal.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        FIRE目標設定
      </a>
      <a class="sidebar-link" href="b9-assumption-settings.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l6-6 4 4 8-8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        想定利回り・リスク設定
      </a>
      <div class="my-2 border-t" style="border-color: hsl(var(--border));"></div>
      <a class="sidebar-link" href="b10-account-settings.html">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round"/></svg>
        アカウント設定
      </a>
    </nav>
  </aside>

  <div class="app-main">
    <header class="app-header">
      <h1 class="text-base font-semibold">不動産登録・編集</h1>
      <div class="flex items-center gap-3">
        <!-- ユーザーメニュー(docs/screen-requirements-account.md 2章)。
             ログアウトの置き場所が他に無いため、アバターからB10へ直接リンクさせずメニューにする -->
        <div class="user-menu">
          <button class="user-menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-label="ユーザーメニュー"
                  onclick="const p = this.nextElementSibling; const opened = !p.classList.toggle('hidden'); this.setAttribute('aria-expanded', String(opened));">
            <span class="user-menu-avatar">太</span>
          </button>
          <div class="user-menu-panel hidden" role="menu">
            <p class="user-menu-email">taro.yamada@example.com</p>
            <a class="user-menu-item" role="menuitem" href="b10-account-settings.html">
              <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke-linecap="round"/></svg>
              アカウント設定
            </a>
            <button class="user-menu-item user-menu-item-signout" role="menuitem" type="button"
                    onclick="document.getElementById('logout-dialog').classList.remove('hidden')">
              <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 17l5-5-5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12H9" stroke-linecap="round"/><path d="M12 20H6a2 2 0 01-2-2V6a2 2 0 012-2h6" stroke-linecap="round"/></svg>
              ログアウト
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 max-w-2xl">
      <section class="card p-6">
        <h2 class="text-base font-bold mb-5">物件情報を編集</h2>

        <form class="flex flex-col gap-5" onsubmit="return false;">
          <div class="field">
            <label class="label">物件名</label>
            <input class="input" value="〇〇マンション101号室" />
          </div>

          <div class="field">
            <label class="label">所在地</label>
            <input class="input" value="東京都渋谷区〇〇1-2-3" />
          </div>

          <!-- 取得年月(docs/screen-requirements-real-estate.md B7)。**未実装**。
               資産推移グラフがこの物件を積み始める起点になる(同 B1「不動産を含む分類軸の集計」)。
               任意入力で、未入力なら最初に時価を記録した日が起点になる。
               B11の発生年月と同じ <input type="month"> で、年と月までしか持たない
               (推移グラフは月次の点で描くので日を入れても描画は変わらない) -->
          <div class="field">
            <label class="label">取得年月(任意)</label>
            <input class="input" type="month" value="2019-04" style="width: auto;" />
            <p class="field-hint">資産推移グラフは、この月から物件を反映します。未入力の場合は最初に記録した日からになります。</p>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="field">
              <label class="label">時価(円)</label>
              <input class="input tabular-nums" value="32000000" />
            </div>
            <div class="field">
              <label class="label">ローン残高(円)</label>
              <input class="input input-error tabular-nums" value="18,400,000" />
              <p class="field-error">半角数字のみ入力してください</p>
            </div>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" id="income-toggle" checked onchange="document.getElementById('income-fields').classList.toggle('hidden', !this.checked)" />
            <span>収益物件として登録(賃貸収入・支出を管理する)</span>
          </label>

          <div id="income-fields" class="grid grid-cols-2 gap-4">
            <div class="field">
              <label class="label">賃貸収入(月額・円)</label>
              <input class="input tabular-nums" value="128000" />
            </div>
            <div class="field">
              <label class="label">賃貸支出(月額・円)</label>
              <input class="input tabular-nums" value="22000" />
            </div>
          </div>

          <div class="flex gap-3 pt-2">
            <a href="b6-real-estate-detail.html" class="btn btn-primary">保存</a>
            <a href="b6-real-estate-detail.html" class="btn btn-ghost">キャンセル</a>
          </div>
        </form>
      </section>
    </main>
  </div>
</div>

<!-- ログアウトの確認ダイアログ(docs/screen-requirements-account.md 2章)。
     2FAが全ユーザー必須で再ログインに認証アプリの確認コードが要るため、誤操作を防ぐ確認を挟む。
     共通ヘッダーのユーザーメニューと、A2・A3の「別のアカウントでログイン」で同じダイアログを使う。 -->
<div id="logout-dialog" class="hidden fixed inset-0 flex items-center justify-center p-4" style="background-color: rgb(0 0 0 / 0.4); z-index: 50;">
  <div class="card p-6 max-w-sm w-full">
    <h3 class="text-base font-bold mb-2">ログアウトしますか?</h3>
    <p class="text-sm text-slate-500 mb-5">次回のログインでは、パスワードに加えて認証アプリの確認コードの入力が必要です。</p>
    <div class="flex gap-3">
      <a href="a4-login.html?loggedOut=1" class="btn btn-primary flex-1">ログアウトする</a>
      <button class="btn btn-ghost" type="button" onclick="document.getElementById('logout-dialog').classList.add('hidden')">キャンセル</button>
    </div>
  </div>
</div>

</body>
</html>
