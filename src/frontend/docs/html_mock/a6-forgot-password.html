<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A6 パスワードをお忘れの方 | FIRE-FIRE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="mb-6 text-center">
      <p class="text-sm font-semibold text-slate-400 mb-1">FIRE-FIRE</p>
      <h1 class="text-xl font-bold">パスワードをお忘れの方</h1>
      <p class="text-sm text-slate-500 mt-2">
        ご登録のメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。
      </p>
    </div>

    <div id="form-area">
      <div class="field mb-6">
        <label class="label" for="email">メールアドレス</label>
        <input class="input" type="email" id="email" placeholder="you@example.com" />
      </div>
      <button class="btn btn-primary btn-block" type="button"
        onclick="document.getElementById('form-area').classList.add('hidden'); document.getElementById('sent-area').classList.remove('hidden');">
        リセットメールを送信する
      </button>
    </div>

    <!-- 送信後: 未登録メールでも同一メッセージを表示(存在有無を推測させない) -->
    <div id="sent-area" class="hidden">
      <div class="alert alert-success">
        <span>入力されたメールアドレス宛にパスワード再設定用のメールを送信しました。メールに記載のリンクから手続きを進めてください。</span>
      </div>
    </div>

    <p class="text-center text-sm text-slate-500 mt-6">
      <a class="link" href="a4-login.html">ログインに戻る</a>
    </p>
  </div>
</div>

</body>
</html>
