<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A7 パスワード再設定 | FIRE-FIRE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css" />
<link rel="stylesheet" href="common.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">

    <!-- 有効なリンクからの遷移(既定表示) -->
    <div id="state-valid">
      <div class="mb-6 text-center">
        <p class="text-sm font-semibold text-slate-400 mb-1">FIRE-FIRE</p>
        <h1 class="text-xl font-bold">新しいパスワードを設定</h1>
      </div>

      <form class="flex flex-col gap-5" onsubmit="return false;">
        <div class="field">
          <label class="label" for="password">新パスワード</label>
          <!-- 入力欄の右端に表示/非表示トグルを重ねる(DESIGN.md 6章) -->
          <div class="relative">
            <input class="input pr-10" type="password" id="password" />
            <button class="password-toggle" type="button" aria-label="パスワードを表示" aria-pressed="false" onclick="togglePassword(this, 'password')">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <p class="field-hint">8文字以上、大文字・小文字・数字・記号を組み合わせてください</p>
        </div>

        <div class="field">
          <label class="label" for="password2">新パスワード(確認用)</label>
          <!-- 入力欄の右端に表示/非表示トグルを重ねる(DESIGN.md 6章) -->
          <div class="relative">
            <input class="input pr-10" type="password" id="password2" />
            <button class="password-toggle" type="button" aria-label="パスワードを表示" aria-pressed="false" onclick="togglePassword(this, 'password2')">
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <p id="password2-error" class="field-error hidden">パスワードが一致しません</p>
        </div>

        <a href="a4-login.html" class="btn btn-primary btn-block">パスワードを再設定する</a>
      </form>
    </div>

    <!-- リンクが無効・期限切れの場合 -->
    <div id="state-invalid" class="hidden">
      <div class="mb-6 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full" style="background-color: hsl(var(--destructive) / 0.1);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="hsl(var(--destructive))" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.86L1.82 18a1.5 1.5 0 0 0 1.3 2.25h17.76a1.5 1.5 0 0 0 1.3-2.25L13.7 3.86a1.5 1.5 0 0 0-2.6 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h1 class="text-xl font-bold">リンクの有効期限が切れています</h1>
        <p class="text-sm text-slate-500 mt-2">
          このパスワード再設定リンクは無効か、有効期限が切れています。お手数ですが再度リセットメールをリクエストしてください。
        </p>
      </div>
      <a href="a6-forgot-password.html" class="btn btn-primary btn-block">パスワードをお忘れの方へ戻る</a>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6 flex flex-col gap-1">
      <span>
        (モック確認用)
        <a class="link" href="#" onclick="document.getElementById('password2').classList.add('input-error'); document.getElementById('password2-error').classList.remove('hidden'); return false;">
          入力不一致エラーの表示例
        </a>
      </span>
      <span>
        (モック確認用)
        <a class="link" href="#" onclick="document.getElementById('state-valid').classList.toggle('hidden'); document.getElementById('state-invalid').classList.toggle('hidden'); return false;">
          リンク無効時の表示に切り替える
        </a>
      </span>
    </p>
  </div>
</div>

<script>
  // パスワード表示トグル(DESIGN.md 6章。A1・A4・A7・A8・B10で必須)。
  // 欄ごとに独立して切り替えられるよう、対象の入力欄のidを引数で受ける。
  function togglePassword(button, inputId) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector("i");
    const willShow = input.type === "password";

    input.type = willShow ? "text" : "password";
    icon.classList.toggle("fa-eye", !willShow);
    icon.classList.toggle("fa-eye-slash", willShow);
    // 状態は aria-pressed だけで伝える(ラベルも切り替えると二重に読み上げられる)
    button.setAttribute("aria-pressed", String(willShow));
  }
</script>

</body>
</html>
