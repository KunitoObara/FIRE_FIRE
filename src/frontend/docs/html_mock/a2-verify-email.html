<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A2 メールアドレス確認待ち | FIRE-FIRE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="common.css" />
</head>
<body>

<div class="auth-shell">
  <div class="auth-card text-center">
    <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-full" style="background-color: hsl(var(--primary) / 0.1);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="hsl(var(--primary))" stroke-width="1.8">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="M3 7l9 6 9-6"/>
      </svg>
    </div>

    <h1 class="text-xl font-bold mb-2">メールアドレスの確認をお願いします</h1>
    <p class="text-sm text-slate-500 mb-1">以下の宛先に確認メールを送信しました。</p>
    <p class="text-sm font-semibold mb-5">taro.yamada@example.com</p>

    <div class="alert alert-info text-left mb-6">
      <span>
        メール本文内のリンクをクリックすると確認が完了し、続けて2段階認証(2FA)の登録に進みます。メールが届かない場合は、迷惑メールフォルダもご確認ください。
      </span>
    </div>

    <button class="btn btn-outline btn-block" type="button">確認メールを再送する</button>

    <p class="text-xs text-slate-400 mt-5">
      メールアドレスが間違っている場合は、
      <a class="link" href="a1-signup.html">サインアップからやり直してください</a>
    </p>

    <!-- 認証フロー途中のログアウト導線(screen-requirements-auth.md 3章)。
         この状態はサインイン済みだがA2から先へ進めず、主要画面もガードで差し戻されるため、
         別アカウントへ切り替える手段がここに無いと行き止まりになる。
         上の「サインアップからやり直す」は同じアカウントでのやり直しで、用途が違うので併置する。 -->
    <p class="text-xs text-slate-400 mt-2">
      別のアカウントを使う場合は、
      <a class="link" href="#" onclick="document.getElementById('logout-dialog').classList.remove('hidden'); return false;">別のアカウントでログイン</a>
    </p>
  </div>
</div>

<!-- ログアウトの確認ダイアログ(screen-requirements-account.md 2章)。B系の共通ヘッダーと同一のもの -->
<div id="logout-dialog" class="hidden fixed inset-0 flex items-center justify-center p-4" style="background-color: rgb(0 0 0 / 0.4); z-index: 50;">
  <div class="card p-6 max-w-sm w-full text-left">
    <h3 class="text-base font-bold mb-2">ログアウトしますか?</h3>
    <p class="text-sm text-slate-500 mb-5">現在のアカウント(taro.yamada@example.com)からログアウトし、ログイン画面へ移動します。</p>
    <div class="flex gap-3">
      <a href="a4-login.html?loggedOut=1" class="btn btn-primary flex-1">ログアウトする</a>
      <button class="btn btn-ghost" type="button" onclick="document.getElementById('logout-dialog').classList.add('hidden')">キャンセル</button>
    </div>
  </div>
</div>

</body>
</html>
